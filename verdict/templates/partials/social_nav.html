{#- Tabs of the social pages. tab — the current one. -#}
{% set me_nav = current_user() %}
<nav class="admin-nav social-nav" aria-label="Сообщество игроков">
    <a href="{{ url_for('ratings') }}"{% if tab == 'ratings' %} class="active" aria-current="page"{% endif %}>{{ icon('trending') }}Рейтинг</a>
    <a href="{{ url_for('friends') }}"{% if tab == 'friends' %} class="active" aria-current="page"{% endif %}>{{ icon('users') }}Друзья</a>
    <a href="{{ url_for('communities') }}"{% if tab == 'communities' %} class="active" aria-current="page"{% endif %}>{{ icon('landmark') }}Сообщества</a>
    <span class="admin-nav-sep" aria-hidden="true"></span>
    {% if me_nav %}
        <a href="{{ url_for('profile', login=me_nav.login) }}"{% if tab == 'profile' and p and p.relation == 'self' %} class="active" aria-current="page"{% endif %}>{{ icon('user') }}Мой профиль</a>
    {% else %}
        <a href="{{ url_for('register', back=request.path) }}">{{ icon('user') }}Завести аккаунт</a>
    {% endif %}
</nav>
