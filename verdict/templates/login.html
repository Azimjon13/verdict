{% extends 'layout.html' %}
{% block content %}

<section class="section auth-section">
    <div class="container">
        <form method="post" class="panel auth-card hud" data-validate novalidate>
            {{ csrf_field() }}
            <input type="hidden" name="back" value="{{ back }}">
            <div class="auth-icon">{{ icon('login') }}</div>
            <span class="kicker">Вход в VERDICT</span>
            <h1>С возвращением</h1>
            <p class="muted">Войдите, чтобы добавлять ситуации и следить за их отбором.</p>

            {% if error %}
                <div class="form-alert" role="alert">{{ icon('alert') }}<span>{{ error }}</span></div>
            {% endif %}

            <label class="field">
                <span>Логин</span>
                <input type="text" name="login" value="{{ login_name }}" required maxlength="40" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
            </label>
            <label class="field">
                <span>Пароль</span>
                <span class="password-wrap">
                    <input type="password" name="password" required autocomplete="current-password">
                    <button type="button" class="pw-toggle" aria-label="Показать пароль" data-pw-toggle>{{ icon('eye') }}</button>
                </span>
            </label>
            <button class="btn btn-primary btn-block btn-lg" type="submit">{{ icon('login') }}Войти</button>
            <p class="auth-switch">Нет аккаунта? <a href="{{ url_for('register', back=back) if back else url_for('register') }}">Зарегистрироваться</a></p>
        </form>
    </div>
</section>
{% endblock %}
