name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      VERDICT_TEST_DB_HOST: 127.0.0.1
      VERDICT_TEST_DB_PORT: 3306
      VERDICT_TEST_DB_USER: root
      VERDICT_TEST_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt pyflakes
      - name: Lint
        run: python -m pyflakes verdict tests scripts passenger_wsgi.py run.py
      - name: Tests
        run: python -m pytest tests -q
      - name: Browser tests (headless Chrome)
        run: python tests/e2e/run.py
