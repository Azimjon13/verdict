name: verdict_mobile
description: "VERDICT — симулятор решений: мобильное приложение."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-Unbounded.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
